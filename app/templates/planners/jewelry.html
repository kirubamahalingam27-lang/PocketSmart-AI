{% extends 'base.html' %}{% block content %}<section class="planner"><div><p class="eyebrow">JEWELRY BUDGET PLANNER</p><h1>Match your jewelry to the occasion and outfit.</h1><p>Upload an outfit image optionally for visual color/style coordination.</p></div><form id="jewelryForm" class="card form-grid" enctype="multipart/form-data"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding, party..." required></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option><option>Contemporary</option></select></label><label>Outfit color<input name="outfit_color" placeholder="Blue, maroon, gold..."></label><label>Jewelry type<select name="jewelry_type"><option>Any</option><option>Necklace</option><option>Earrings</option><option>Bracelet</option><option>Set</option></select></label><label>Outfit image<input name="image" type="file" accept="image/*"></label><label class="wide">Notes<textarea name="notes"></textarea></label><button class="btn wide">Generate recommendations</button></form><div id="results"></div></section>{% endblock %}
