{% extends 'base.html' %}{% block content %}<section class="planner"><div><p class="eyebrow">HOME INTERIOR PLANNER</p><h1>Build a beautiful room within budget.</h1><p>Tell us what you need and let PocketSmart allocate the budget.</p></div><form id="homeForm" class="card form-grid"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Room type<select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option></select></label><label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Bohemian</option><option>Luxury</option></select></label><label>Location<input name="location" value="India"></label><label class="wide">Items <small>Format: category:quantity, category:quantity</small><input name="items" placeholder="Lighting:2, Wall Decor:2, Storage:1"></label><label class="wide">Notes<textarea name="notes"></textarea></label><button class="btn wide">Generate recommendations</button></form><div id="results"></div></section>{% endblock %}
