{% extends 'base.html' %}{% block content %}<section class="planner"><div><p class="eyebrow">PARTY BUDGET PLANNER</p><h1>Organize the event without the budget guesswork.</h1><p>Allocate spending across food, venue, decoration and entertainment.</p></div><form id="partyForm" class="card form-grid"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Engagement</option><option>House Party</option></select></label><label>Venue<input name="venue" placeholder="Not decided"></label><label>City<input name="city"></label><label>Food preference<input name="food_preference" value="Mixed"></label><label class="wide">Notes<textarea name="notes"></textarea></label><button class="btn wide">Generate recommendations</button></form><div id="results"></div></section>{% endblock %}
